version: '3'

services:
  server:
    build: ./server
    container_name: mern-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    restart: always

  client:
    build: ./client
    container_name: mern-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always 